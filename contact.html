<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Contacto | SecureNet</title>

        <link rel="stylesheet" href="../CSS/css.css">
    </head>

    <body>

        <header class="info-header">

            <a class="brand" href="../index.html">
                <img src="../IMG/logo.png" alt="Logo de SecureNet">
                <span>SecureNet</span>
            </a>

            <a class="back-link" href="../index.html">
                Volver al inicio
            </a>

        </header>


        <main class="info-page">

            <section class="info-intro">

                <p class="eyebrow">Contacto</p>

                <h1>Contáctanos</h1>

                <p>
                    ¿Tienes alguna pregunta sobre seguridad digital?
                    Envíanos un mensaje y cuéntanos tus dudas.
                </p>

            </section>


            <section class="info-grid">

                <article class="info-card">

                    <h2>Envíanos un mensaje</h2>

                    <form>

                        <label for="nombre">Nombre:</label>
                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            required
                        >

                        <label for="correo">Correo electrónico:</label>
                        <input
                            type="email"
                            id="correo"
                            name="correo"
                            required
                        >

                        <label for="mensaje">Mensaje:</label>
                        <textarea
                            id="mensaje"
                            name="mensaje"
                            rows="6"
                            required
                        ></textarea>

                        <button type="submit" class="hero-button">
                            Enviar mensaje
                        </button>

                    </form>

                </article>

            </section>


            <a class="hero-button info-button" href="../index.html">
                Regresar al inicio
            </a>

        </main>


        <footer class="footer">

            <p>
                &copy; 2026 SecureNet. Todos los derechos reservados.
            </p>

            <nav class="social-links" aria-label="Redes sociales">
                <a href="#">
                    YouTube
                    <img src="../IMG/youtube.svg" alt="">
                </a>
                <a href="#">
                    X
                    <img src="../IMG/xlogo.svg" alt="">
                </a>
                <a href="#">
                    Instagram
                    <img src="../IMG/ig.svg" alt="">
                </a>
            </nav>
            <nav class="resource-links" aria-label="Recursos externos de ciberseguridad">
                <a href="https://www.incibe.es/ciudadania" target="_blank" rel="noopener noreferrer">INCIBE</a>
                <a href="https://www.osi.es/es" target="_blank" rel="noopener noreferrer">Oficina de Seguridad del Internauta</a>
            </nav>

        </footer>

    </body>
</html>
